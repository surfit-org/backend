spring:
  application:
    name: backend

  datasource:
    # 1. DB 접속 주소 및 타임존 설정
    url: jdbc:mysql://localhost:3306/surfit_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    # 2. .env의 변수를 참조 (보안 유지)
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    # 3. Redis 설정
    redis:
      host: localhost
      port: 6379

  jpa:
    # 4. ORM 및 SQL 로그 설정
    hibernate:
      ddl-auto: update
    show-sql: true

arirang:
  api:
    base-url: ${ARIRANG_API_BASE_URL}
    api-key: ${ARIRANG_API_KEY}

