plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    // 체크스타일 플러그인
    id 'checkstyle'
}

// 체크스타일 상세 설정
checkstyle {
    toolVersion = "10.12.1"        // 체크스타일 버전

    // 네이버 규칙 파일 경로 지정
    configFile = file("${rootProject.projectDir}/config/checkstyle/naver-checkstyle-rules.xml")

    // 규칙 어길 시 빌드 실패 여부
    ignoreFailures = false

    // 콘솔에 에러 내용 출력
    showViolations = true
}

// suppressions 파일 경로를 규칙 파일에서 인식하도록 설정
tasks.withType(Checkstyle) {
    reports {
        xml.required = true
        html.required = true // 사람이 보기 편한 HTML 보고서 생성
    }
    // Checkstyle 10.x 이상: config_loc은 configDirectory로 대체
    configDirectory = file("${rootProject.projectDir}/config/checkstyle")
    // naver-checkstyle-rules.xml 내부의 ${suppressionFile} 변수에 경로 주입
    configProperties = [
        'suppressionFile': "${rootProject.projectDir}/config/checkstyle/naver-checkstyle-suppressions.xml"
    ]
}

group = 'com.surfit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // [Core & Web] REST API 개발을 위한 스프링 부트의 핵심 엔진
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // [Database - SQL] 자바 객체와 MySQL 테이블을 자동으로 연결 (JPA/Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // [Database - Driver] 자바와 MySQL 데이터베이스가 통신하게 해주는 통역사
    runtimeOnly 'com.mysql:mysql-connector-j'

    // [Database - NoSQL] 캐싱 및 속도 최적화를 위한 Redis 연동 부품 (수행계획서 핵심 기술)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // [Efficiency] 반복되는 코드(Getter, Setter 등)를 자동으로 생성해주는 도구
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // [Dev Tools] 코드 수정 시 서버를 자동으로 재시작해주는 개발 편의 기능
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // [API Docs] 우리가 만든 API를 웹에서 한눈에 보고 테스트하는 Swagger UI (자동 문서화)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // [Test] 우리가 짠 코드가 잘 작동하는지 검증하기 위한 테스트 도구 모음
    // JUnit5, Mockito, MockMvc, AssertJ 등 테스트에 필요한 도구가 모두 포함됨
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
