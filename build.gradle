plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.surfit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// [Core & Web] REST API 개발을 위한 스프링 부트의 핵심 엔진
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// [Database - SQL] 자바 객체와 MySQL 테이블을 자동으로 연결 (JPA/Hibernate)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// [Database - Driver] 자바와 MySQL 데이터베이스가 통신하게 해주는 통역사
	runtimeOnly 'com.mysql:mysql-connector-j'

	// [Database - NoSQL] 캐싱 및 속도 최적화를 위한 Redis 연동 부품 (수행계획서 핵심 기술)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// [Efficiency] 반복되는 코드(Getter, Setter 등)를 자동으로 생성해주는 도구
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// [Dev Tools] 코드 수정 시 서버를 자동으로 재시작해주는 개발 편의 기능
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// [API Docs] 우리가 만든 API를 웹에서 한눈에 보고 테스트하는 Swagger UI (자동 문서화)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// [Test] 우리가 짠 코드가 잘 작동하는지 검증하기 위한 테스트 도구 모음
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
